<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Mensagens</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <main>
        <header>
            <h1>Mensagens</h1>
            <button id="nova-mensagem">
                Nova mensagem
            </button>
        </header>

        <section id="lista-mensagens"></section>
    </main>

    <dialog id="modal-mensagem">
        <form id="form-mensagem">
            <h2 id="titulo-formulario">
                Nova mensagem
            </h2>

            <input
                type="hidden"
                id="mensagem-id"
            >

            <label for="mensagem-texto">
                Mensagem:
            </label>

            <input
                type="text"
                id="mensagem-texto"
                required
            >
            
            <label for="autor">Autor</label>

            <select id="autor" name="autor" required>
                <option value="">
                    Selecione um autor
                </option>
            </select>

            <div class="acoes">
                <button type="submit">
                    Salvar
                </button>

                <button
                    type="button"
                    id="cancelar-mensagem"
                >
                    Cancelar
                </button>
            </div>
        </form>
    </dialog>

    <script
        type="module"
        src="js/mensagens.js"
    ></script>
</body>
</html>
